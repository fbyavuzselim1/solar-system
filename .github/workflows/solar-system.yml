 name: solar system workflow
 
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    services:
      mongo-db:
        image: siddhart67/mongo-db:non-prod
        ports:
          - 27017:27017
    env:
        MONGO_URI: 'mongodb://localhost/superData'
        MONGO_USERNAME: non-prod-user
        MONGO_PASSWORD: non-prod-password  
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      
      - run: npm install
      - run: npm test

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3

      - name: Install Dependencies
        run: npm install

      - name: Check Code Coverage
        continue-on-error: true
        run: npm run coverage

      - name: Archive Test Result
        uses: actions/upload-artifact@v4
        with:
          name: code coverage result
          path: coverage
          retention-days: 5
  

  docker:
    name: Containerization
    needs: [unit-testing, code-coverage]
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: GHCR Login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}          

      - name: Docker Build For Testing
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}    
      
      - name: Docker Image Testing
        run: |
          docker images
          docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_URI=$MONGO_URI \
              -e MONGO_USERNAME=$MONGO_USERNAME \
              -e MONGO_PASSWORD=$MONGO_PASSWORD \
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

          export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo $IP

          echo Testing Image URL using wget
          wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Container Registry Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
             ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}  
             ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }} 


  dev-deploy:
    needs: docker
    environment:
     name: development
     url: https://${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}
    outputs:
      APP_INGRESS_URL: ${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }} 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4     
      - name: Install kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
         version: 'v1.26.0'
      - name: Set Kubeconfig File
        uses: azure/k8s-set-context@v2
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
      - name: Fetch Kubernetes Cluster Details
        run: |
         kubectl version --short
         echo ------------------
         kubectl get nodes
      - name: Fetch Ingress External IP
        run: |
          INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "ingressIP=$INGRESS_IP" >> $GITHUB_ENV
      - uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '${'
          tokenSuffix: '}'
          files: '["kubernetes/development/*.yaml"]'
        env:
          NAMESPACE: ${{vars.NAMESPACE}}
          REPLICAS: ${{vars.REPLICAS}}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}  
          INGRESS_IP: ${{env.INGRESS_IP}}
      - name: Check Files
        run: |
          cat kubernetes/development/*.yaml
      - name: Create MongoDB Secret
        run: |
         kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
         --from-literal=MONGO_URI=${{ env.MONGO_URI}} \
         --from-literal=MONGO_USERNMAME=${{secrets.MONGO_PASSWORD}} \
         --save-config  \
         --dry-run=client  \
         -o yaml | kubectl apply -f -
      - name: Deploy to Env 
        run: |
         kubectl apply -f kubernetes/development
      - name: Set App Ingress Host URL
        id: set-ingress-host-address
        run: |
         echo "APP_INGRESS_HOST=$(kubectl -n ${{vars.NAMESPACE}} get ingress -o jsonpath='{.items[0].spec.tls[0].hosts[0]}')" >> $GITHUB_ENV 

integration-testing:
  needs: dev-deploy
  runs-on: ubuntu-latest
  steps:
    - name: Test Live Endpoint
      env:
        URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}
      run: |
        echo $URL
        echo "-------------------------------"
        curl -k "https://$URL/live" -s -k | jq -r .status | grep -i live
