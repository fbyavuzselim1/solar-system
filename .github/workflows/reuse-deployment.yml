name: Deployment - Reusable Workflow

on:
    workflow_call:
        secrets:
            k8s-kubeconfig:    
                required: true
            mongodbb-password:
                required: true
        inputs:
            mongodb-uri:
                required: true
                type: string

    
jobs:
    reuse-deploy:
        environment:
            name: deployment
            url: https//${{steps.set-ingress-host-address.outputs.APP_INGRESS_HOST}}
        outputs:
            APP_INGRESS_URL: ${{steps.set-ingress-host-address.outputs.APP_INGRESS_HOST}}
        runs-on: ubuntu-latest
